services:
  appia-tools:
    build:
      context: .
      args:
        APP_IP: ${APP_IP:-10.254.255.178}
    container_name: appia-tools
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://appia:${POSTGRES_PASSWORD}@db:5432/appia_tools
      - APP_IP=${APP_IP:-10.254.255.178}
    ports:
      - "2023:8501"
    volumes:
      - appia_tools_certs:/app/certs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: appia-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appia_tools
    volumes:
      - appia_tools_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appia -d appia_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  appia_tools_pgdata:
  appia_tools_certs:
